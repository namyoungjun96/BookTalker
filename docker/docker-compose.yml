services:
  postgresql:
    image: "postgres:16.15"
    container_name: "postgresql-book-talker"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "book_talker_db"
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "password"
    volumes:
      - pgdata:/var/lib/postgresql/data

